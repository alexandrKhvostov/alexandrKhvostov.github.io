decisions:
  - kind: decision
    title: Production only through promote
    why: Write tools take only dev, stage and test as a stage, so prod is not a valid input, and the tool code checks it again. This keeps the agent from writing to production directly and leaves one path to it, which validates every config against prod first.
  - kind: decision
    title: Confirm flag on catalog writes, instruction before promotion
    why: "The four subscription write tools default to confirm: false, which previews the change and saves nothing. Those writes change live pricing data in a product backend, so the safe mode is the default. They persist only when called with confirm: true, and the server enforces that. promote_config has no such flag. The workflow tells the agent to run diff_config, show the summary and wait for a yes, and that step is an instruction the agent follows. Even the catalog flag does not prove a person saw the preview, because the agent sets it, and the tool docs say so."
  - kind: decision
    title: Schemas imported, not copied
    why: An earlier design snapshotted JSON Schema files and guarded them against drift. Importing the Zod objects from the quiz library leaves no copy of the schemas to drift. Three semantic validators are still mirrored by hand and kept at least as strict as the library.
  - kind: decision
    title: Reference docs served in pieces
    why: The full reference is about 423 KB, which MCP clients would truncate. The first call returns the workflow and, once a project is chosen, a section index, and the agent asks for the sections it needs. One tool returns the fields of a single type.
  - kind: decision
    title: Pack keys and prices come from the server
    why: Subscription pack keys are generated from names on the server and per-day prices are computed, so the agent does not have to invent them. With no catalog connected, tools return an explicit refusal, because an empty list would invite a made-up key.
  - kind: decision
    title: Stateless server, built per request
    why: Each request gets a new MCP server and transport, so any replica can serve any call and no session store is needed. The 2026-07-28 MCP spec made the protocol core stateless in the same way, so moving the server to it takes little work. The cost is registering 17 tools on every request, which was not measured.
  - kind: next
    title: Roles and rollback
    why: Today any signed-in employee with a valid token can promote, from the VPN or through the Claude connector, and there is no tool to list or restore earlier versions of a config. Roles and S3 versioning are on the improvement list.
rules:
  items:
    - rule: Only the corporate VPN and Anthropic can reach the service
      why: The production ingress accepts only the company VPN's IP and Anthropic's published outbound IPs, so the tools are closed to the rest of the internet before any token is checked. Cursor and Codex connect from an employee's machine on the VPN, and the Claude connector connects from Anthropic's cloud.
      heldBy:
        - ingress IP allowlist
    - rule: Write tools cannot target prod
      why: A model must not publish to production directly. Prod is reachable only through promote, which validates every planned config against the target stage first.
      heldBy:
        - Zod enum
        - check in tool code
        - tests
    - rule: Schemas are imported from the quiz library, not copied
      why: The builder and the renderers parse with the same schema objects, so there is no copy to drift.
      heldBy:
        - shared Zod objects
        - pinned package version
        - examples test
    - rule: Hand-mirrored validators may be stricter than the library, never looser
      why: A config that passes here and fails in the player ships broken.
      heldBy:
        - convention, documented per validator
        - validation tests
    - rule: The project registry is checked at startup
      why: A bad entry could merge two products' catalogs or break every project, so the process exits on duplicate ids or aliases, shared catalog URLs or a missing API key.
      heldBy:
        - startup check
  agents: CLAUDE.md documents the layers, the tool module pattern, the project registry and the production workflow. Seven project skills scaffold new tools and prompts and run the pull request and release steps. The server is also built for agents, since its first call hands the model the workflow and a section index.
