title: Quiz builder MCP
company: playme
period: "2026"
order: 1
role: Senior Full Stack Developer / Engineering Lead. Designed the service and led the team that built it; wrote the tasks.
disciplines: [backend]
aiAgents: true
summary: MCP server that lets a marketer's AI agent build, preview and promote quiz and paywall configs for PlayMe products, with validation on every write.
glance:
  - value: 2 days
    label: to build a funnel, down from 2 to 3 weeks
  - value: 90%
    label: of funnel building done without a developer
  - value: "17"
    label: MCP tools
  - value: "48"
    label: test files, about 600 cases
stack:
  - TypeScript
  - Node.js 24
  - Express 5
  - MCP SDK
  - Zod
  - jose
  - AWS S3
  - CloudFront
  - Vitest
  - Docker
  - Helm
overview:
  - Marketers need new quiz and paywall variants quickly, but the configs are strict JSON checked against a schema library. The builder lets an AI agent such as Claude write that JSON through MCP tools. The server validates it, stores it as a file in S3 behind a CDN, returns a preview link and guards the move to production. A new funnel used to take two to three weeks to build. With the builder it takes a couple of days, and about 90% of the work no longer needs a developer.
  - Writes go to dev, stage or a test sandbox only. Production is reachable only through a promote tool, which validates every config against the target stage before copying anything. Shape validation uses the same Zod schemas as the quiz and paywall renderers, imported from the quiz library. Every config save, patch and promote records an audit entry with the author from the JWT.
  - One deployment serves several products, picked by a required project parameter. Each project has its own storage path, preview URLs and subscription catalog backend. The server keeps no state between requests and scales between 2 and 3 replicas in production. It started from the MCP template and verifies tokens from the auth service.
diagram:
  type: pipeline
  caption: The path of a config from an agent's request to production, with validation, a diff and audit entries.
  nodes:
    - id: agent
      label: AI agent
    - id: tools
      label: Tools and validation
    - id: dev
      label: Dev stage
    - id: diff
      label: Diff and review
    - id: prod
      label: Prod stage
    - id: audit
      label: Audit log
  steps:
    - from: agent
      to: tools
      label: save_config
      note: Auth middleware checks the caller's JWT before the tool runs. The tool resolves the project, then validates the config with the quiz library's Zod schemas plus structure and subscription-pack checks. An invalid config writes nothing and returns a report the agent can fix from.
    - from: tools
      to: dev
      label: Write JSON
      note: A valid config is stored in S3 under project, stage and id, and the agent gets a preview link. Write tools accept only dev, stage and test.
    - from: tools
      to: audit
      label: Audit entry
      note: Every config write records an audit entry with the author from the JWT. If the audit write fails, the change stays and the agent is told.
    - from: dev
      to: diff
      label: diff_config
      note: The tool lists what would change in the target stage, plus the status of region variants. The workflow has the agent show this to the person and wait for a yes before promoting. That step is an instruction the agent follows, not something the server enforces.
    - from: diff
      to: prod
      label: promote_config
      note: Every config in the set is validated against prod before anything is copied. Then S3 copies the files unchanged, leaves first.
    - from: prod
      to: audit
      label: Audit entry and CDN refresh
      note: A promotion records an audit entry and invalidates the CDN cache for the promoted files when a distribution is configured.
structure:
  tree: |
    config/projects.json               project registry
    quiz-builder-docs/                 guides served to the agent
    src/core/                          reusable MCP plumbing (server, env, auth)
    src/domain/tools/<tool>/           register.ts and core.ts per tool
    src/domain/tools/with-project.ts   project parameter and capability check
    src/domain/storage/                ConfigStore: S3 and in-memory
    src/domain/validation/             funnel validation
    src/domain/subscriptions/          subscription catalog client
    src/domain/audit.ts                audit records
    tests/                             48 test files and fixtures
  notes:
    - path: src/core/ and src/domain/
      why: Core is the MCP plumbing that comes from the MCP template, which holds the Express app, env parsing, auth and the tool wrappers. Domain is the builder itself, with storage, validation, the project registry, the catalog client, the tools and audit. The README says to avoid editing core unless necessary.
    - path: src/domain/tools/<tool>/
      why: "Each tool has its own folder. register.ts is the MCP layer. core.ts holds the logic, takes its dependencies as arguments and imports no MCP or AWS SDK code, so tests call it directly with fake stores."
    - path: src/domain/tools/with-project.ts
      why: Adds the project parameter to every tool (required everywhere except the context tool), resolves aliases and checks that the project has the capability the tool needs. Tools never declare project themselves, so none can skip project scoping.
    - path: src/domain/storage/
      why: ConfigStore is an interface with an S3 implementation and an in-memory one. Both use the same serialization and etag rules, so tests run against memory while production uses S3.
    - path: config/projects.json
      why: The one place that lists projects, their aliases, preview URLs and subscription catalog backends. It is checked at startup, and the process exits on a bad entry.
tools:
  title: Tools
  intro: "17 MCP tools. Every tool name carries the server prefix and takes a required project parameter; only the context tool makes it optional."
  groups:
    - title: Configs
      items:
        - name: get_builder_context
          does: Returns the workflow and the list of connected projects; for a project, an index of the reference docs, or only the sections the agent asks for.
        - name: get_type_schema
          does: Returns the field reference for one step type, paywall section type, static-info section type or root config.
        - name: list_configs
          does: Lists the project's quiz and paywall configs across stages, with where dev differs from prod, the links between configs and their variants.
        - name: get_config
          does: Reads one config from one stage with its etag, last modified time and author.
        - name: save_config
          does: Validates a config and writes it to dev, stage or test, never prod, then returns a preview link.
        - name: patch_config
          does: Applies an ordered list of edits to an existing config. If an edit fails or the result is invalid, nothing is written.
        - name: validate_funnel
          does: Checks a draft quiz and paywall against a stage without writing anything.
        - name: diff_config
          does: Lists what would change in the target stage if the config were promoted, plus the state of its region variants.
        - name: promote_config
          does: Copies a config from one stage to another unchanged, together with its dependent configs when asked to, after validating each against the target. It is the only path to prod.
    - title: Subscription catalog
      note: "Paywall projects only, backed by the product backend's admin API. The four write tools default to a dry-run preview and save only when called with confirm: true."
      items:
        - name: list_subscription_packs / list_subscription_plans
          does: Searches and pages through the catalog's packs or plans.
        - name: get_subscription_pack / get_subscription_plan
          does: Reads one pack or plan. A plan read also lists the packs that use it.
        - name: save_subscription_pack
          does: Creates or updates a pack with its plans, on dev or stage. Keys are generated on the server from names and per-day prices are computed, so the agent supplies neither.
        - name: patch_subscription_pack
          does: Renames a pack or changes its plans and their order, with a revision token to catch concurrent edits.
        - name: patch_subscription_plan
          does: Changes a plan's own fields and returns the packs that use it, as a preview of the impact.
        - name: promote_subscription_pack
          does: Re-creates a pack and its missing plans on another stage under the same keys. A second run reports that the pack is already there.
showcase:
  title: A funnel built by the agent
  intro: Dualio is an AI photo and video app. The funnel linked below runs from a short quiz through sign-up to a scratch card with a discount and then the paywall. The agent wrote both configs, quiz and paywall, through the builder's tools, and the web app renders them with the quiz library.
  link:
    label: Open the live funnel
    url: https://dualio.ai/quiz/flow5gl
  screens:
    - image: ../../assets/projects/quiz-builder/01-question.jpg
      alt: A dark phone screen with a progress bar and back arrow at the top, the question "What vibe do you want for your video?" and five emoji answer buttons.
      caption: Single-choice step
    - image: ../../assets/projects/quiz-builder/02-loader.jpg
      alt: A loading screen with the text "Creating your perfect look" and a percentage, laid over a looping background video.
      caption: Progress-sequence loader with a background video set in the step's layout
    - image: ../../assets/projects/quiz-builder/03-registration.jpg
      alt: A sign-up screen with a "Continue with Google" button, name and email fields, two checkboxes for terms and marketing, and a Continue button.
      caption: Pre-registration step
    - image: ../../assets/projects/quiz-builder/04-scratch-card.jpg
      alt: A screen titled "Your reward is waiting" with a card covered by a scratch layer and the hint "Scratch it off".
      caption: Scratch-card step that unlocks the discount
    - image: ../../assets/projects/quiz-builder/05-paywall.jpg
      alt: A paywall with a row of trend video cards at the top, a ticket showing the applied promo code and a countdown, and three subscription plans with a price per day.
      caption: Paywall with promo code, countdown and plans
    - image: ../../assets/projects/quiz-builder/06-checkout.jpg
      alt: A checkout drawer over the paywall with the regular price, the discount, the applied promo code and the total, followed by card fields and a Pay button.
      caption: Checkout drawer with the discount breakdown
  points:
    - "The quiz config has 10 steps of 6 types: static info, single choice, photo upload, progress sequence, registration and scratch card. The quiz library allows 17 step types."
    - "Each step can override its own layout, such as the header, progress bar, navigation, buttons and a looping background video. The look itself is one theme for the whole funnel, chosen by the web app from the quiz id."
    - "Every step has an analytics name, and all quiz events go through one analytics class that adds the quiz id. The standard events are quiz_step_view, sign_up_view, sign_up_try, sign_up_scs, sign_up_fail and scratch_card, and the paywall adds sale events such as sale_view and sale_scs."
    - "Events reach Google Analytics 4 through Google Tag Manager, and ad pixels, Meta among them, run through the same container."
    - "The quiz names the paywall to open next, so the two configs are separate files linked by an id."
    - "A US variant, saved as separate @us files, changes the legal texts, the pricing pack and the timer settings. The web app picks it by country and falls back to the default files, so these differences live in the config and not in code."
    - "The paywall config names its subscription pack by key. The plans and prices come from the catalog that the builder manages, where the per-day prices are computed on the server."
  excerpt:
    caption: "One step of the config the agent wrote: the question, three of the five answers, header settings, the next step and the analytics fields."
    code: |
      {
        "id": "q_vibe",
