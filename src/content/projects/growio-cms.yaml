overview:
  - Growio CMS is the web panel where editors build Growio's financial literacy courses. A course has versions, a version has units, a unit has chapters, a chapter has lessons, and a lesson is a list of blocks. Each level is a page with its details and a table of the level below. Units, chapters and lessons are reordered by dragging.
  - A lesson block holds text written in a rich text editor, images, videos and quiz questions, either single choice or true or false. Media goes from the browser to an upload URL that the API hands out. A course moves from draft to review, approval and publication, one button per state. The same content API can also be driven by agents through the Growio CMS MCP.
  - The app is a React single-page app on Refine, an admin framework that supplies resource, table and form hooks, with shadcn components on top. Docker builds it, nginx serves it and a Helm chart deploys it to five environments. Production is deployed from version tags.
diagram:
  type: sequence
  caption: How an image and a published course get from an editor to the app.
  nodes:
    - id: editor
      label: Editor
    - id: cms
      label: CMS
    - id: api
      label: API
    - id: storage
      label: Storage
    - id: app
      label: Growio app
  steps:
    - from: editor
      to: cms
      label: Add an image
      note: The editor picks a file in an image block, and the CMS reads its width and height in the browser.
    - from: cms
      to: api
      label: Start upload
      note: The CMS posts the file name to the uploads endpoint and gets back an upload id and an upload URL.
    - from: cms
      to: storage
      label: Send the file
      note: The CMS sends the file with PUT to that URL, with the file's content type.
    - from: cms
      to: api
      label: Complete and create
      note: The CMS confirms the upload id, then creates the image record with the upload id, width and height.
    - from: cms
      to: api
      label: Save the block
      note: The CMS puts the block's nodes to the lesson blocks endpoint, each with a sort order that follows its place on the page.
    - from: editor
      to: cms
      label: Move the course on
      note: The course page shows one button for the current status, either send for review, approve or publish.
    - from: cms
      to: api
      label: Change status
      note: The CMS posts to the submit for review, approve or publish endpoint of the course, then reloads the course.
    - from: app
      to: api
      label: Read the course
      note: The Growio app reads courses and lessons from the same endpoints.
structure:
  tree: |
    src/
      routes/               public and protected routes, behind Refine's Authenticated
      pages/                one per route, minimal logic
      features/             one folder per resource: Courses to LessonBlocks
      widgets/              layout with sidebar, modal manager
      components/           ui (shadcn), refine-ui (registry), common
      providers/            Refine auth provider
      rest-data-provider/   Refine data provider over axios
      services/             auth service, reorder and identity hooks
      lib/                  env, storage, API clients with token refresh
      types/                domain models, generated API types
    docs/                   architecture rules, git flow, env variables
    Web.App/k8s/            Helm chart and values for five environments
  notes:
    - path: pages and features
      why: A page is the entry point of one route. It renders an information block and the table of the level below. A feature folder holds the logic for one resource, with its table, modal forms and column definitions. The architecture doc has a short test for deciding whether code is a page, a feature, a widget or a component.
    - path: components
      why: ui holds 26 shadcn primitives in the New York style, set up in components.json. refine-ui holds buttons, views and the data table installed from the Refine registry. common holds the app's own pieces, such as the entity modal, the draggable table and the confirm dialog.
    - path: rest-data-provider
      why: Refine talks to the backend through this provider. It turns pagination into page and pageSize, filters into query parameters and sorters into _sort and _order, so a table only names its resource and its parent id.
    - path: lib/api-client
      why: Two HTTP clients live here. The openapi-fetch client makes the typed auth calls, and the axios client serves Refine's data provider. Both attach the bearer token and refresh it on a 401.
    - path: types
      why: The domain models are hand written. The API types are generated from the backend's Swagger by the prepare script at install, and the generated file is git-ignored. The Docker build passes the API address in so that step can run there.
    - path: Web.App/k8s
      why: A Helm chart with a deployment, service, autoscaler and ingress. It has one values folder per environment. The deployment probes /health, and the ingress takes only the address ranges listed in each environment's values.
tools:
  title: Content types
  intro: The levels an editor works through, and the nodes a lesson block can hold.
  groups:
    - title: Content tree
      note: Only courses have a list page. Every other level opens from the table of its parent.
      items:
        - name: Course
          does: Created from the course list with a title and a description. It has the review flow, from send for review to publish, and it can be archived.
        - name: Version
          does: The versions of a course in one table. A version can be duplicated or archived.
        - name: Unit
          does: The units of a version, in a table that can be reordered by dragging.
        - name: Chapter
          does: The chapters of a unit, also reorderable.
        - name: Lesson
          does: The lessons of a chapter. The new order is saved through the chapter's lessons order endpoint.
        - name: Lesson block
          does: A named block of a lesson, edited in the block editor, where its nodes are dragged into order.
    - title: Block nodes
      note: A block saves its nodes as one list, each with a sort order.
      items:
        - name: Text
          does: A title and a description in TipTap, with bold, italic, underline and strike.
        - name: Image
          does: Uploaded from the browser and stored with its width and height.
        - name: Video
          does: Uploaded the same way and stored as an MP4 upload with its duration in seconds.
        - name: Question
          does: Single choice with up to 4 options, or true or false. Both types need an explanation and feedback for a wrong answer.
decisions:
  - kind: decision
    title: Each content level is a table in its parent's page, filtered by the parent id
    why: A course page lists its versions, a version page its units, a unit page its chapters, a chapter page its lessons and a lesson page its blocks. Each table is a Refine useTable with a permanent filter on the parent id. A new resource is a resources entry, a feature folder, a page and a route, and CLAUDE.md lists those steps.
  - kind: decision
    title: One button follows the course status
    why: The course page shows the next step for the status the API returns. A draft offers send for review, a submitted course offers approve, an approved course offers publish, and a published course shows a disabled button. Each step posts to its own endpoint of the course and reloads it, so the status always comes from the API.
  - kind: decision
    title: Files go to a storage URL and the block stores only ids
    why: For an image or a video the CMS asks the API to start an upload, sends the file with PUT to the upload URL it gets back, confirms the upload, and then creates the image or video record with its size or duration. A block's node list holds the image, video or question id and a sort order, not the file.
  - kind: decision
    title: Quiz questions are validated with Zod before they are saved
    why: A schema per question type runs when the editor saves. Single choice needs the question text, an explanation, feedback for a wrong answer, at least 2 options with text and at least one correct option. True or false needs the text, both explanations and the correct answer.
  - kind: decision
    title: Both HTTP clients share one refresh behaviour
    why: The typed openapi-fetch calls and Refine's axios data provider each attach the bearer token and refresh it on a 401 under an async-mutex lock. Requests that fail at the same time wait for one refresh and are replayed with the new token. When the refresh fails, the stored tokens are cleared and the editor goes to the login page.
  - kind: decision
    title: Production deploys only from version tags, with an image built per environment
    why: A manual workflow run deploys the dev and stage environments, and a v* tag deploys prod. Each run builds the image with that environment's API address as a build argument, pushes it to the registry and deploys the Helm chart with the environment's values.
rules:
  items:
    - rule: Pages stay thin, features hold the logic, widgets only compose
      why: Each layer has one job, so a route entry point stays short and business code sits next to its resource.
      heldBy:
        - documented in docs/ARCHITECTURE.md with a where-does-this-code-belong test
        - documented in CLAUDE.md
    - rule: Browser storage is reached only through lib/storage
      why: Keys live in one enum and one place handles parse errors.
      heldBy:
        - documented in docs/ARCHITECTURE.md and CLAUDE.md
    - rule: Environment variables, the API address included, are read through lib/env
      why: The app gets one validated entry point and a clear message when the API address is not a URL.
      heldBy:
        - Zod schema in lib/env.ts, which throws a numbered list of problems
        - documented in docs/ARCHITECTURE.md and CLAUDE.md
    - rule: Biome is the only linter and formatter, with sorted imports and sorted Tailwind classes
      why: One tool and one config mean the same style from every editor and every contributor.
      heldBy:
        - biome.json, where unused imports and unsorted classes are errors
        - lint-staged in the pre-commit hook
        - TypeScript check and build in the pre-push hook
    - rule: Production is deployed only by a v* tag, and the other environments by a manual run
      why: Every production version has a tag, and a branch push cannot reach production by accident.
      heldBy:
        - CI workflow triggers
        - documented in docs/GIT_FLOW.md
  agents: CLAUDE.md gives an agent the stack, the steps for adding a resource, the Biome rules and a short workflow (plan first, run the build, check the UI in a browser). One project skill drafts the release merge message from the diff against main, and its tools are limited to git and gh commands. The Growio CMS MCP is a separate project that calls the same REST API, so agents can create and edit courses without this panel.
