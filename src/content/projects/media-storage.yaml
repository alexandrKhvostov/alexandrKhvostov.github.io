title: Media storage MCP
company: playme
period: "2026"
order: 8
role: Designed and built the server.
disciplines: [backend]
aiAgents: true
summary: MCP server that lets an AI agent upload, optimize and list images and video on PlayMe's CDN, from a URL or from the agent's sandbox.
